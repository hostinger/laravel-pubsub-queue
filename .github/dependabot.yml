version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "**/*"
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "hostinger/platform-team"
    schedule:
      interval: "daily"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dependencies:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
